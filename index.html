<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VertexMain | CI/CD Bot Engine</title>
    <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #050505;
            --panel-bg: #0f0f0f;
            --border: #333;
            --neon-green: #00ff9d;
            --text-main: #e0e0e0;
        }
        body { margin: 0; background: var(--bg-dark); color: var(--text-main); font-family: 'JetBrains Mono', monospace; overflow: hidden; height: 100vh; display: flex; }
        .sidebar { width: 280px; background: var(--panel-bg); border-right: 1px solid var(--border); padding: 20px; display: flex; flex-direction: column; z-index: 10; }
        .main-content { flex: 1; display: flex; flex-direction: column; background: #050505; position: relative; }
        .vrtx-header { padding: 15px 30px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        #editor-wrapper { flex: 1; position: relative; }
        #editor-container { position: absolute; top: 0; bottom: 0; left: 0; right: 0; }
        .terminal { height: 200px; background: #000; border-top: 2px solid var(--border); padding: 15px; font-size: 0.85rem; color: var(--neon-green); overflow-y: auto; white-space: pre-wrap; }
        .file-tab { padding: 8px 15px; background: #1a1a1a; border: 1px solid var(--border); cursor: pointer; margin-right: 5px; font-size: 0.8rem; display: inline-block; }
        .file-tab.active { border-bottom: 2px solid var(--neon-green); color: var(--neon-green); }
        .btn-vrtx { background: var(--neon-green); color: #000; border: none; padding: 8px 18px; font-weight: bold; cursor: pointer; font-family: 'JetBrains Mono'; }
        #login-overlay { position: fixed; inset: 0; background: #000; z-index: 999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <div id="login-overlay">
        <h1 style="font-family: 'Dela Gothic One'; color: var(--neon-green); font-size: 3rem;">VERTEXMAIN</h1>
        <button class="btn-vrtx" onclick="window.googleLogin()">INITIALIZE CORE</button>
    </div>

    <div class="sidebar">
        <div style="font-family: 'Dela Gothic One'; color: var(--neon-green); font-size: 1.2rem; margin-bottom: 30px;">VRTX BOT OS</div>
        <p style="font-size: 0.7rem; color: #555;">BOT REPOSITORY</p>
        <div id="tabs">
            <div class="file-tab active" id="tab-py" onclick="switchFile('py')">bot_logic.py</div>
            <div class="file-tab" id="tab-yml" onclick="switchFile('yml')">config.yml</div>
        </div>
        <div style="margin-top: auto; border-top: 1px solid #333; padding-top: 15px;">
            <div id="user-info" style="display: flex; align-items: center; gap: 10px;">
                <img id="u-avatar" src="" style="width: 30px; border-radius: 50%;">
                <span id="u-name" style="font-size: 0.8rem;">Agent</span>
            </div>
        </div>
    </div>

    <div class="main-content">
        <div class="vrtx-header">
            <div><span style="color: #555;">repo/</span><span id="file-name" style="color: var(--neon-green);">bot_logic.py</span></div>
            <button class="btn-vrtx" onclick="triggerBot()">▶ EXECUTE DEPLOY BOT</button>
        </div>
        <div id="editor-wrapper"><div id="editor-container"></div></div>
        <div class="terminal" id="vrtx-term">[SYSTEM]: Bot Core Loaded. Waiting for YAML trigger...</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.4.12/ace.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAvCQnDWfR38gH6SOoyyxRenFWGE5RgnAU",
            authDomain: "vertex-main-register.firebaseapp.com",
            projectId: "vertex-main-register",
            storageBucket: "vertex-main-register.firebasestorage.app",
            messagingSenderId: "790052740688",
            appId: "1:790052740688:web:218edfab89a4e46b9cbb55"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        window.googleLogin = () => signInWithPopup(auth, provider);
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('login-overlay').style.display = 'none';
                document.getElementById('u-name').innerText = user.displayName;
                document.getElementById('u-avatar').src = user.photoURL;
            }
        });

        let files = {
            py: `import vrtx_system\n\ndef run_deploy():\n    data = vrtx_system.get_site_data()\n    config = vrtx_system.load_yaml('config.yml')\n    \n    print(f"[*] Bot detected update for: {config['project']['name']}")\n    print(f"[*] Deploying to: {config['project']['domain']}")\n    \n    vrtx_system.deploy_site(data, config['project'])\n    print("[+] Deployment Successful!")\n\nrun_deploy()`,
            yml: `project:\n  name: "MyVertexApp"\n  domain: "my-app.vertexmain.v6.rocks"\n  version: "1.0.0"\n  auto_build: true\n  environment: "production"`
        };

        let currentFile = 'py';
        const editor = ace.edit("editor-container");
        editor.setTheme("ace/theme/twilight");
        editor.session.setMode("ace/mode/python");
        editor.setValue(files.py, -1);

        window.switchFile = (ext) => {
            files[currentFile] = editor.getValue();
            currentFile = ext;
            editor.setValue(files[ext], -1);
            document.querySelectorAll('.file-tab').forEach(t => t.classList.remove('active'));
            document.getElementById('tab-' + ext).classList.add('active');
            document.getElementById('file-name').innerText = ext === 'py' ? 'bot_logic.py' : 'config.yml';
            editor.session.setMode(ext === 'py' ? "ace/mode/python" : "ace/mode/yaml");
        };

        window.triggerBot = () => {
            const term = document.getElementById('vrtx-term');
            files[currentFile] = editor.getValue();
            term.innerHTML += `\n\n[BOT]: Starting CI/CD Process...`;
            try {
                const config = jsyaml.load(files.yml);
                setTimeout(() => {
                    term.innerHTML += `\n[PYTHON]: Running bot_logic.py...`;
                    term.innerHTML += `\n[SYSTEM]: Reading site data...`;
                    term.innerHTML += `\n[SYSTEM]: Deploying ${config.project.name} v${config.project.version}...`;
                    term.innerHTML += `\n<span style="color:white">[SUCCESS]: Site live at https://${config.project.domain}</span>`;
                    term.scrollTop = term.scrollHeight;
                }, 800);
            } catch (e) {
                term.innerHTML += `\n<span style="color:red">[ERROR]: YAML Config Invalid!</span>`;
            }
        };
    </script>
</body>
</html>
