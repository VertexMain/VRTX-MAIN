<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VertexMain Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #050505;
            --panel-bg: #0f0f0f;
            --border: #333;
            --neon-green: #00ff9d;
            --text-main: #e0e0e0;
        }

        body {
            margin: 0; background-color: var(--bg-dark); color: var(--text-main);
            font-family: 'JetBrains Mono', monospace; overflow: hidden; height: 100vh;
        }

        #login-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        
        .login-box {
            border: 2px solid var(--neon-green); padding: 40px; text-align: center;
            background: rgba(0, 255, 157, 0.05);
            box-shadow: 0 0 40px rgba(0, 255, 157, 0.1);
            max-width: 400px; width: 90%;
        }

        .btn-login {
            background: var(--neon-green); color: black; border: none;
            padding: 15px 25px; font-family: 'Dela Gothic One'; font-size: 1rem;
            cursor: pointer; margin-top: 25px; transition: 0.3s; width: 100%;
            text-transform: uppercase;
        }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 0 20px var(--neon-green); }

        #app-interface { display: none; height: 100vh; width: 100vw; }

        .sidebar {
            width: 260px; background: var(--panel-bg); border-right: 1px solid var(--border);
            padding: 20px; display: flex; flex-direction: column; flex-shrink: 0;
        }

        .main-content { flex: 1; padding: 30px; overflow-y: auto; position: relative; background: #050505; }

        .nav-item {
            padding: 12px; margin-bottom: 5px; cursor: pointer; color: #888; display: flex; align-items: center;
            border-radius: 4px; transition: 0.2s; font-weight: bold;
        }
        .nav-item:hover, .nav-item.active { color: var(--neon-green); background: rgba(0, 255, 157, 0.1); }
        .nav-item i { width: 30px; text-align: center; }

        .page-section { display: none; }
        .page-section.active { display: block; animation: fadeIn 0.4s ease; }

        #editor-container { 
            width: 100%; height: 500px; border: 1px solid var(--border); margin-top: 20px; 
        }

        .repo-card {
            background: #111; border: 1px solid #333; padding: 15px; 
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 10px; border-left: 3px solid var(--neon-green);
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .system-msg { color: #555; font-size: 0.8rem; margin-top: 5px; }
    </style>
</head>
<body>

    <div id="login-screen">
        <img src="вертекс%20ма.png" alt="Logo" style="width: 100px; margin-bottom: 20px; filter: drop-shadow(0 0 10px var(--neon-green));">
        <h1 style="font-family: 'Dela Gothic One'; color: var(--neon-green); font-size: 2.5rem; margin: 0 0 20px 0;">VERTEXMAIN</h1>
        <div class="login-box">
            <p style="letter-spacing: 1px; font-weight: bold;">SYSTEM LOCKED</p>
            <button class="btn-login" onclick="window.googleLogin()">
                <i class="fa-brands fa-google" style="margin-right: 10px;"></i> Access via Google
            </button>
        </div>
    </div>

    <div id="app-interface">
        <div class="sidebar">
            <div style="margin-bottom: 40px; display: flex; align-items: center; gap: 10px;">
                <img src="вертекс%20ма.png" style="width: 30px;">
                <span style="font-family: 'Dela Gothic One'; color: var(--neon-green); font-size: 1.1rem;">VRTX OS</span>
            </div>

            <div class="nav-item active" onclick="showPage('dashboard')" id="btn-dashboard">
                <i class="fa-solid fa-chart-line"></i> Dashboard
            </div>
            <div class="nav-item" onclick="showPage('repos')" id="btn-repos">
                <i class="fa-solid fa-box-archive"></i> Repositories
            </div>
            <div class="nav-item" onclick="showPage('editor')" id="btn-editor">
                <i class="fa-solid fa-code"></i> VRTX Code IDE
            </div>
            
            <div style="margin-top: auto; border-top: 1px solid #333; padding-top: 20px; display: flex; align-items: center; gap: 12px;">
                <img id="user-avatar" src="" style="width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--neon-green);">
                <div style="overflow: hidden;">
                    <div id="user-name" style="font-size: 0.85rem; color: white; white-space: nowrap; text-overflow: ellipsis; font-weight: bold;">Loading...</div>
                    <div onclick="window.logout()" style="font-size: 0.7rem; color: #ff4444; cursor: pointer; margin-top: 2px;">Disconnect ►</div>
                </div>
            </div>
        </div>

        <div class="main-content">
            <div id="dashboard" class="page-section active">
                <h2 style="font-family: 'Dela Gothic One'; color: var(--neon-green);">OVERVIEW</h2>
                <div style="background: #111; padding: 25px; border: 1px solid #333; border-left: 4px solid var(--neon-green);">
                    <h3 style="margin-top: 0;">Welcome, Agent</h3>
                    <p style="font-size: 1.2rem; color: white;" id="welcome-name">User</p>
                    <p class="system-msg">Security Level: <b>ADMIN</b></p>
                </div>
            </div>

            <div id="repos" class="page-section">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <h2 style="font-family: 'Dela Gothic One'; color: var(--neon-green);">REPOSITORIES</h2>
                    <button onclick="createNewRepo()" class="btn-login" style="margin:0; width:auto; padding: 5px 15px;">+ NEW REPO</button>
                </div>
                <div id="repo-list" style="margin-top: 20px;"></div>
            </div>

            <div id="editor" class="page-section">
                <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #333; padding-bottom: 10px;">
                    <h2 style="font-family: 'Dela Gothic One'; color: var(--neon-green); margin: 0;">VRTX IDE</h2>
                    <button onclick="runCode()" style="background: var(--neon-green); border: none; padding: 8px 20px; font-weight: bold; cursor: pointer;">▶ RUN & SAVE</button>
                </div>
                <div id="editor-container">alert('Hello VertexMain!');</div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.4.12/ace.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAvCQnDWfR38gH6SOoyyxRenFWGE5RgnAU",
            authDomain: "vertex-main-register.firebaseapp.com",
            projectId: "vertex-main-register",
            storageBucket: "vertex-main-register.firebasestorage.app",
            messagingSenderId: "790052740688",
            appId: "1:790052740688:web:218edfab89a4e46b9cbb55",
            measurementId: "G-48DHV8HYC4"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        window.googleLogin = async () => {
            try { await signInWithPopup(auth, provider); } 
            catch (error) { alert("Auth Error: " + error.message); }
        };

        window.logout = () => signOut(auth);

        onAuthStateChanged(auth, (user) => {
            document.getElementById('login-screen').style.display = user ? 'none' : 'flex';
            document.getElementById('app-interface').style.display = user ? 'flex' : 'none';
            if (user) {
                document.getElementById('user-name').innerText = user.displayName;
                document.getElementById('welcome-name').innerText = user.displayName;
                document.getElementById('user-avatar').src = user.photoURL || '';
                loadRepos();
            }
        });

        const editor = ace.edit("editor-container");
        editor.setTheme("ace/theme/twilight");
        editor.session.setMode("ace/mode/javascript");

        let projects = JSON.parse(localStorage.getItem('vrtx_repos')) || [];
        let currentRepoId = null;

        window.createNewRepo = () => {
            const name = prompt("Repository Name:");
            if (!name) return;
            const repo = { id: Date.now(), name: name, code: "// New Project", url: "" };
            projects.push(repo);
            saveRepos();
        };

        window.deployRepo = (id) => {
            const repo = projects.find(p => p.id === id);
            alert("🤖 VRTX BOT: Deploying to vertexmain.v6.rocks/" + repo.name.toLowerCase() + "...");
            setTimeout(() => {
                repo.url = "vertexmain.v6.rocks/" + repo.name.toLowerCase().replace(/\s+/g, '-');
                saveRepos();
                alert("🚀 Deployed!");
            }, 1500);
        };

        window.editRepo = (id) => {
            const repo = projects.find(p => p.id === id);
            currentRepoId = id;
            editor.setValue(repo.code);
            showPage('editor');
        };

        window.runCode = () => {
            const code = editor.getValue();
            if (currentRepoId) {
                const repo = projects.find(p => p.id === currentRepoId);
                repo.code = code;
                saveRepos();
            }
            try { eval(code); } catch (e) { alert(e.message); }
        };

        function saveRepos() {
            localStorage.setItem('vrtx_repos', JSON.stringify(projects));
            loadRepos();
        }

        function loadRepos() {
            const list = document.getElementById('repo-list');
            list.innerHTML = "";
            projects.forEach(repo => {
                list.innerHTML += `
                    <div class="repo-card">
                        <div>
                            <strong>${repo.name}</strong><br>
                            <small style="color:#555">${repo.url || 'Not deployed'}</small>
                        </div>
                        <div>
                            <button onclick="editRepo(${repo.id})" style="cursor:pointer">EDIT</button>
                            <button onclick="deployRepo(${repo.id})" style="cursor:pointer; background:var(--neon-green); border:none">DEPLOY</button>
                        </div>
                    </div>`;
            });
        }

        window.showPage = (id) => {
            document.querySelectorAll('.page-section').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.getElementById('btn-' + id).classList.add('active');
        };
    </script>
</body>
</html>
