<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VERTEX MAIN - Public GitHub</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #000; 
            color: #00ff9d; 
            font-family: monospace; 
            height: 100vh;
            overflow: hidden;
        }
        
        .hidden { display: none !important; }
        
        .btn {
            background: #00ff9d;
            color: #000;
            border: none;
            padding: 10px 20px;
            font-family: monospace;
            font-weight: bold;
            cursor: pointer;
            margin: 5px;
        }
        
        #login-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        
        .login-box {
            text-align: center;
            padding: 40px;
            border: 2px solid #00ff9d;
        }
        
        .repo-input {
            width: 100%;
            padding: 10px;
            background: #111;
            color: #00ff9d;
            border: 1px solid #333;
            margin: 10px 0;
            font-family: monospace;
        }
        
        .main-area {
            display: flex;
            height: 100vh;
        }
        
        .sidebar {
            width: 250px;
            background: #111;
            padding: 20px;
            overflow-y: auto;
        }
        
        .repo-item {
            background: #222;
            padding: 10px;
            margin: 5px 0;
            cursor: pointer;
        }
        
        .repo-item:hover {
            border-left: 3px solid #00ff9d;
        }
        
        #editor {
            width: 100%;
            height: 400px;
            background: #000;
            color: #00ff9d;
            border: 1px solid #333;
            padding: 15px;
            font-family: monospace;
            font-size: 14px;
        }
        
        .terminal {
            background: #000;
            border: 1px solid #333;
            padding: 15px;
            height: 150px;
            overflow-y: auto;
            color: #00ff9d;
            font-family: monospace;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <!-- Простой логин -->
    <div id="login-overlay">
        <div class="login-box">
            <h1 style="font-size: 2.5rem; margin-bottom: 20px;">VERTEX MAIN</h1>
            <input type="text" id="username-input" class="repo-input" placeholder="Твое имя" value="Гость">
            <button class="btn" onclick="startApp()" style="margin-top: 20px;">
                НАЧАТЬ
            </button>
        </div>
    </div>

    <!-- Основной интерфейс -->
    <div id="app-container" class="hidden">
        <div style="padding: 15px; background: #111; border-bottom: 1px solid #333;">
            <button class="btn" onclick="createRepo()">+ СОЗДАТЬ РЕПО</button>
            <button class="btn" onclick="saveFile()">💾 СОХРАНИТЬ</button>
            <button class="btn" onclick="deploy()">🚀 ДЕПЛОЙ</button>
            <span style="margin-left: 20px; color: #666;" id="current-repo"></span>
        </div>
        
        <div class="main-area">
            <!-- Список репозиториев -->
            <div class="sidebar">
                <h3>РЕПОЗИТОРИИ:</h3>
                <div id="repos-list">
                    <!-- Репо будут здесь -->
                </div>
            </div>
            
            <!-- Редактор -->
            <div style="flex: 1; padding: 20px;">
                <textarea id="editor" placeholder="Выберите или создайте репозиторий"></textarea>
                
                <div class="terminal" id="terminal">
[SYSTEM]: VERTEX MAIN запущен
[SYSTEM]: Все сайты: vrtxmain.v6.rocks/репозиторий
                </div>
            </div>
        </div>
    </div>

    <script>
        // Глобальные переменные
        let repos = {};
        let currentRepo = null;
        let username = "Гость";
        
        // Файлы по умолчанию
        const defaultFiles = `<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Мой сайт</title>
    <style>
        body { 
            font-family: monospace; 
            background: #000; 
            color: #00ff9d;
            padding: 40px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>🚀 VERTEX MAIN</h1>
    <p>Мой сайт работает!</p>
</body>
</html>`;

        // Запуск приложения
        function startApp() {
            const nameInput = document.getElementById('username-input').value;
            if (nameInput) username = nameInput;
            
            document.getElementById('login-overlay').classList.add('hidden');
            document.getElementById('app-container').classList.remove('hidden');
            
            // Загружаем сохраненные репозитории
            loadRepos();
            log('Привет, ' + username + '!');
        }

        // Создать репозиторий
        function createRepo() {
            const repoName = prompt('Имя репозитория (латинские буквы, цифры, дефисы):');
            if (!repoName) return;
            
            // Проверяем имя
            const cleanName = repoName.toLowerCase().replace(/[^a-z0-9-]/g, '');
            if (cleanName.length < 3) {
                alert('Минимум 3 символа');
                return;
            }
            
            if (repos[cleanName]) {
                alert('Репо уже существует');
                return;
            }
            
            // Создаем репозиторий
            repos[cleanName] = {
                name: cleanName,
                files: defaultFiles,
                created: new Date().toLocaleString(),
                owner: username,
                url: `vrtxmain.v6.rocks/${cleanName}`
            };
            
            // Сохраняем
            saveRepos();
            
            // Открываем
            openRepo(cleanName);
            
            log(`Создан репозиторий: ${cleanName}`);
            log(`Сайт будет: ${repos[cleanName].url}`);
        }

        // Открыть репозиторий
        function openRepo(repoName) {
            currentRepo = repoName;
            const repo = repos[repoName];
            
            document.getElementById('current-repo').textContent = `📁 ${repoName} | 👤 ${repo.owner}`;
            document.getElementById('editor').value = repo.files;
            
            // Обновляем список
            updateReposList();
        }

        // Сохранить файл
        function saveFile() {
            if (!currentRepo) {
                alert('Сначала создайте репозиторий');
                return;
            }
            
            const content = document.getElementById('editor').value;
            repos[currentRepo].files = content;
            
            saveRepos();
            log(`Сохранено: ${currentRepo}`);
        }

        // Деплой
        function deploy() {
            if (!currentRepo) {
                alert('Сначала создайте репозиторий');
                return;
            }
            
            saveFile();
            
            const repo = repos[currentRepo];
            
            log(`🚀 Деплой ${currentRepo}...`);
            setTimeout(() => log(`📦 Сборка...`), 500);
            setTimeout(() => log(`🌐 Загрузка на сервер...`), 1000);
            setTimeout(() => {
                log(`✅ Сайт задеплоен!`);
                log(`🔗 Открыть: ${repo.url}`);
                
                // Показываем ссылку
                if (confirm(`Сайт готов!\n\nОткрыть ${repo.url} ?`)) {
                    window.open(`/${currentRepo}`, '_blank');
                }
            }, 1500);
        }

        // Загрузить репозитории из localStorage
        function loadRepos() {
            const saved = localStorage.getItem('vertexmain_repos');
            if (saved) {
                repos = JSON.parse(saved);
                updateReposList();
            }
        }

        // Сохранить репозитории в localStorage
        function saveRepos() {
            localStorage.setItem('vertexmain_repos', JSON.stringify(repos));
        }

        // Обновить список репозиториев
        function updateReposList() {
            const list = document.getElementById('repos-list');
            list.innerHTML = '';
            
            for (const repoName in repos) {
                const repo = repos[repoName];
                const div = document.createElement('div');
                div.className = 'repo-item';
                div.innerHTML = `
                    <strong>${repoName}</strong><br>
                    <small style="color: #666;">${repo.owner}</small>
                `;
                
                div.onclick = () => openRepo(repoName);
                list.appendChild(div);
            }
        }

        // Логирование
        function log(message) {
            const terminal = document.getElementById('terminal');
            terminal.innerHTML += '\n' + message;
            terminal.scrollTop = terminal.scrollHeight;
        }

        // Запускаем при загрузке
        window.onload = function() {
            // Авто-старт через 1 секунду если есть имя
            setTimeout(() => {
                if (!document.getElementById('login-overlay').classList.contains('hidden')) {
                    startApp();
                }
            }, 1000);
        };
    </script>
</body>
</html>
